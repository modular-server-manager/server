vars:
  build_tools: $(realpath ${PROJECT_DIR}/../build-tools)
  version: $(${PYTHON} ${build_tools}/get_version.py ${PROJECT_DIR}) 
  package_name: $(echo ${name} | tr '-' '_')
  build_dir: ${PROJECT_DIR}/${package_name}
  dist_dir: ${PROJECT_DIR}/dist


files-groups:
  source-files:
    - ${PROJECT_DIR}/src/**/*.py
    - ${PROJECT_DIR}/pyproject.toml
    - ${PROJECT_DIR}/src/**/*.json
    - ${PROJECT_DIR}/src/**/*.xml


rules:
  build-package:
    tags:
      - build
    required-files: source-files
    expected-files:
      - ${PROJECT_DIR}/dist/${package_name}-${version}.tar.gz
      - ${PROJECT_DIR}/dist/${package_name}-${version}-py3-none-any.whl
    commands:
      - cp -r ${PROJECT_DIR}/src ${build_dir}
      - ${PYTHON} ${build_tools}/create_metadata.py ${build_dir} -v ${version}
      - MSM_VERSION=${version} ${PYTHON} -m build --wheel --sdist --outdir ${dist_dir} ${PROJECT_DIR}
      - rm -rf ${build_dir}

  # install-editable:
  #   tags:
  #     - dev-setup
  #   required-files: source-files
  #   commands:
  #     - ${PYTHON} -m pip install -e ${PROJECT_DIR}

  install:
    tags:
      - setup
    required-files:
      - ${PROJECT_DIR}/dist/${package_name}-${version}-py3-none-any.whl
    commands:
      - ${PYTHON} -m pip install ${PROJECT_DIR}/dist/${package_name}-${version}-py3-none-any.whl --force-reinstall

  # tests:
  #   tags:
  #     - test
  #   required-files: source-files
  #   commands:
  #     - ${PYTHON} -m unittest discover -s tests